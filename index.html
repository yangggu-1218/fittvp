<title>FITT-VP 처방 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 폰 프레임 안의 온보딩 퀴즈(질문 1개/화면, 방향성 슬라이드) → 결과 5탭. 모든 그림은 코드로 그린 관절 일러스트가 실제로 운동 동작을 반복. 발표 덱의 회색 종이 + 진홍 체크 모티프 */
:root {
  --paper: #DEDADA;
  --screen: #F6F4F4;
  --card: #FFFFFF;
  --ink: #1C1919;
  --muted: #625B5B;
  --line: #DAD4D4;
  --red: #A3131F;
  --red-soft: #F6E3E4;
  --good: #2D7A4D;
  --good-soft: #E2F0E7;
  --warn: #9A6412;
  --warn-soft: #FAEFD9;
  --on-red: #FFFFFF;
  --fig-far: #BDB4B4;
  --prop: #8E8686;
  --zone1: #ECE8E8;
  --zone2: #E1DADA;
  --zone3: #F2CFD2;
  --zone4: #E5A9AE;
  --font-display: "Black Han Sans", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C0B0B; --screen: #171414; --card: #221E1E; --ink: #F2EEEE; --muted: #B4ABAB; --line: #3A3333;
    --red: #E2525C; --red-soft: #3B1E21; --good: #6CC793; --good-soft: #1B3226; --warn: #E5B25A; --warn-soft: #3A2D16; --on-red: #161414;
    --fig-far: #5E5555; --prop: #8A8080; --zone1: #2A2525; --zone2: #332C2C; --zone3: #4A2529; --zone4: #6B2E34; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C0B0B; --screen: #171414; --card: #221E1E; --ink: #F2EEEE; --muted: #B4ABAB; --line: #3A3333;
  --red: #E2525C; --red-soft: #3B1E21; --good: #6CC793; --good-soft: #1B3226; --warn: #E5B25A; --warn-soft: #3A2D16; --on-red: #161414;
  --fig-far: #5E5555; --prop: #8A8080; --zone1: #2A2525; --zone2: #332C2C; --zone3: #4A2529; --zone4: #6B2E34; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px;
  display: grid; place-items: center;
  background-image: repeating-conic-gradient(color-mix(in srgb, var(--ink) 4%, transparent) 0 25%, transparent 0 50%); background-size: 48px 48px;
}
.phone {
  width: 100%; max-width: 430px; height: min(900px, 100%); min-height: 600px; background: var(--screen); border: 2px solid var(--ink);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; position: relative; box-shadow: 10px 10px 0 color-mix(in srgb, var(--red) 85%, transparent);
}
@media (max-width: 480px) { body { padding: 0; background-image: none; } .phone { border: 0; height: 100%; max-width: none; box-shadow: none; } }

/* figures */
.fig { display: block; }
.fig path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .fr { stroke: var(--fig-far); stroke-width: 4.5; }
.fig .nr { stroke: var(--ink); stroke-width: 5; }
.fig .hl { stroke: var(--red); stroke-width: 5; }
.fig .tor { stroke: var(--ink); stroke-width: 6.5; }
.fig .hlt { stroke: var(--red); stroke-width: 6.5; }
.fig .hd { fill: var(--ink); }
.fig .pr { stroke: var(--prop); stroke-width: 2.2; }
.fig .pa { stroke: var(--ink); stroke-width: 2.6; }
.fig .gr { stroke: var(--line); stroke-width: 2; }
.fig .pf { fill: var(--prop); }
.fig .bd { stroke: var(--red); stroke-width: 1.8; }
.fig .wv { stroke: var(--prop); stroke-width: 2; }
.fig .pulse { fill: none; stroke: var(--red); stroke-width: 1.5; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* top bar */
.bar { display: grid; grid-template-columns: 44px minmax(0, 1fr) 76px; align-items: center; gap: 8px; padding: 12px 14px 8px; }
.bar > button[hidden] { display: block !important; visibility: hidden; }
.iconbtn { width: 36px; height: 36px; border: 0; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.prog { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.prog i { height: 4px; background: var(--line); position: relative; overflow: hidden; }
.prog i::after { content: ""; position: absolute; inset: 0; background: var(--red); transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
.prog i.on::after { transform: scaleX(1); }
.skip { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; text-align: right; }
.apptitle { font-family: var(--font-display); font-size: 18px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.apptitle span { color: var(--red); }

.body { overflow-y: auto; overflow-x: hidden; padding: 6px 20px 20px; position: relative; scroll-behavior: smooth; }
.scr { display: grid; gap: 14px; }
.scr.in-r { animation: inR .34s cubic-bezier(.2, .8, .2, 1); }
.scr.in-l { animation: inL .34s cubic-bezier(.2, .8, .2, 1); }
.scr.fade { animation: fade .28s ease; }
@keyframes inR { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes inL { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.rise > * { animation: fade .4s ease backwards; }
.rise > *:nth-child(2) { animation-delay: .05s; } .rise > *:nth-child(3) { animation-delay: .1s; } .rise > *:nth-child(4) { animation-delay: .15s; }
.rise > *:nth-child(5) { animation-delay: .2s; } .rise > *:nth-child(6) { animation-delay: .25s; } .rise > *:nth-child(n+7) { animation-delay: .3s; }

.qhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.step { font-family: var(--font-num); font-size: 12px; color: var(--red); letter-spacing: .06em; }
.scr h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.22; margin: 2px 0 0; text-wrap: balance; }
.scr h2:focus { outline: none; }
.lead { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.qhead .fig { width: 84px; height: 84px; margin-bottom: -6px; }

/* option cards */
.opts { display: grid; gap: 10px; }
.opts.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opts.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt {
  font: inherit; text-align: left; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); padding: 14px; cursor: pointer;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; position: relative; min-width: 0;
  transition: border-color .15s, background-color .15s, transform .12s;
}
.opt:active { transform: scale(.97); }
.opts.g2 .opt, .opts.g3 .opt { grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; min-height: 100px; }
.opts.g3 .opt { min-height: 92px; padding: 12px 10px; }
.mk { width: 44px; height: 44px; display: grid; place-items: center; border: 1.5px solid var(--ink); color: var(--ink); transition: background-color .15s, color .15s; }
.opt b { display: block; font-size: 15.5px; }
.opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
.opt[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); }
.opt[aria-pressed="true"] .mk { background: var(--red); border-color: var(--red); color: var(--on-red); }
.opt .chk { position: absolute; top: 8px; right: 9px; width: 20px; height: 20px; border-radius: 50%; background: var(--red); color: var(--on-red); display: grid; place-items: center; transform: scale(0); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); }
.opt .chk svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 3; fill: none; }
.opt[aria-pressed="true"] .chk { transform: scale(1); }
.preset { grid-template-columns: 64px minmax(0, 1fr) auto; padding: 8px 12px 8px 8px; }
.preset .fig { width: 64px; height: 64px; background: var(--screen); }
.preset .go { color: var(--red); font-size: 20px; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

/* fields */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .lbl { font-size: 13px; color: var(--muted); }
.unit { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border: 1.5px solid var(--line); background: var(--card); transition: border-color .15s; }
.unit:focus-within { border-color: var(--red); }
.unit input { font: inherit; font-family: var(--font-num); font-size: 20px; font-weight: 600; border: 0; background: transparent; color: var(--ink); padding: 10px 12px; width: 100%; min-width: 0; outline: none; }
.unit input::-webkit-outer-spin-button, .unit input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.unit input[type=number] { -moz-appearance: textfield; }
.unit span { padding-right: 12px; color: var(--muted); font-size: 13px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1.5px solid var(--ink); background: var(--card); position: relative; }
.seg button { font: inherit; font-size: 14px; padding: 10px 2px; border: 0; border-left: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; transition: background-color .15s, color .15s; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--on-red); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { font: inherit; font-size: 14px; padding: 8px 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: all .15s; }
.chips button[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); color: var(--red); font-weight: 700; }
.sub { font-size: 13px; color: var(--muted); font-weight: 700; margin: 2px 0 -6px; }
details.blood summary { cursor: pointer; font-size: 14px; color: var(--red); font-weight: 700; padding: 6px 0; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.live { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; border: 1.5px dashed var(--line); padding: 10px 12px; }
.live .n { font-family: var(--font-num); font-size: 26px; font-weight: 600; color: var(--red); min-width: 3.5ch; }
.live .t { font-size: 13px; }

/* body map & ecg */
.bodymap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
.bodymap svg { width: 150px; height: auto; }
.bm-body { fill: var(--zone2); }
.bm-zone { fill: transparent; stroke: var(--red); stroke-width: 1.6; stroke-dasharray: 3 3; cursor: pointer; transition: fill .15s; }
.bm-zone:hover { fill: var(--red-soft); }
.bm-zone.on { fill: var(--red); stroke-dasharray: none; animation: throb 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes throb { 50% { transform: scale(1.12); } }
.bm-list { display: grid; gap: 8px; }
.ecg { width: 100%; height: 56px; }
.ecg path { fill: none; stroke: var(--red); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 420; animation: ecg 2.2s linear infinite; }
.ecg .base { stroke: var(--line); stroke-dasharray: none; animation: none; stroke-width: 1.4; }
@keyframes ecg { from { stroke-dashoffset: 420; } to { stroke-dashoffset: -420; } }
.weekprev { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.weekprev div { text-align: center; font-size: 12px; padding: 8px 0 6px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); transition: all .2s; }
.weekprev div.on { background: var(--red); border-color: var(--red); color: var(--on-red); font-weight: 700; }
.vol { display: grid; gap: 6px; }
.vol .row { display: flex; justify-content: space-between; font-size: 13px; }
.vol .trk { height: 10px; background: var(--line); position: relative; }
.vol .trk i { position: absolute; inset: 0 auto 0 0; background: var(--red); transition: width .4s ease; }
.vol .trk b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }

/* footer */
.foot { padding: 12px 20px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); border-top: 1.5px solid var(--line); background: var(--screen); }
.primary { font: inherit; font-weight: 700; font-size: 16px; width: 100%; padding: 14px; background: var(--red); color: var(--on-red); border: 0; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: transform .12s, opacity .2s; }
.primary:active { transform: scale(.98); }
.primary:disabled { opacity: .35; cursor: not-allowed; }
.secondary { font: inherit; font-size: 14px; width: 100%; padding: 12px; background: transparent; color: var(--ink); border: 1.5px solid var(--ink); cursor: pointer; }
.why { margin: 0 0 8px; color: var(--red); font-size: 12.5px; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 0 0 env(safe-area-inset-bottom, 0px); position: relative; }
.tab { font: inherit; font-size: 12px; padding: 9px 2px 10px; background: transparent; border: 0; color: var(--muted); cursor: pointer; display: grid; gap: 3px; justify-items: center; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--red); font-weight: 700; }
.tabs .ind { position: absolute; top: -1.5px; height: 3px; width: 20%; background: var(--red); transition: left .3s cubic-bezier(.2, .8, .2, 1); }

/* welcome */
.hero { position: relative; display: grid; gap: 12px; }
.stage { position: relative; height: 210px; border: 2px solid var(--ink); background: var(--card); overflow: hidden; }
.stage .chk { position: absolute; inset: auto 0 0 0; height: 44px; background: repeating-conic-gradient(var(--red) 0 25%, transparent 0 50%) 0 0 / 22px 22px; opacity: .9; }
.stage .fig { position: absolute; left: 50%; bottom: 10px; width: 190px; height: 190px; transform: translateX(-50%); }
.stage .badge { position: absolute; top: 12px; left: 12px; font-family: var(--font-num); font-size: 12px; background: var(--ink); color: var(--screen); padding: 4px 8px; }
.stage .hrb { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--font-num); font-weight: 600; color: var(--red); }
.stage .hrb .ic { animation: beat 1s ease-in-out infinite; }
@keyframes beat { 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } 60% { transform: scale(1); } }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1.08; margin: 4px 0 0; }
.hero h1 span { color: var(--red); }
.hero p { margin: 0; color: var(--muted); }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 12px; text-align: center; }
.flow div { border: 1.5px solid var(--line); padding: 8px 2px; background: var(--card); display: grid; justify-items: center; gap: 2px; }
.flow .ic { color: var(--red); width: 20px; height: 20px; }

/* loading */
.loading { display: grid; justify-items: center; gap: 14px; padding: 24px 0; text-align: center; }
.loading .fig { width: 170px; height: 170px; }
.loading h2 { margin: 0; }
.checks { display: grid; gap: 10px; width: 100%; max-width: 300px; text-align: left; }
.checks div { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; opacity: .25; animation: tick .3s ease forwards; }
.checks div span { width: 22px; height: 22px; border: 1.5px solid var(--red); display: grid; place-items: center; color: var(--on-red); }
.checks div span svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 3; fill: none; }
.checks div:nth-child(1) { animation-delay: .25s; } .checks div:nth-child(2) { animation-delay: .75s; } .checks div:nth-child(3) { animation-delay: 1.25s; } .checks div:nth-child(4) { animation-delay: 1.7s; }
@keyframes tick { to { opacity: 1; } }
.checks div span { animation: fillchk .3s ease forwards; animation-delay: inherit; background: transparent; }
@keyframes fillchk { to { background: var(--red); } }

/* results */
.card { background: var(--card); border: 1.5px solid var(--line); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.ink { border: 2px solid var(--ink); }
.card h3 { margin: 0; font-size: 14px; color: var(--red); display: flex; align-items: center; gap: 6px; }
.card h3 .ic { width: 18px; height: 18px; }
.today { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: center; }
.today .fig { width: 112px; height: 112px; background: var(--screen); }
.focus { display: flex; flex-wrap: wrap; gap: 6px; }
.focus span { border: 1.5px solid var(--red); color: var(--red); padding: 2px 8px; font-size: 12.5px; font-weight: 700; }
.focus span.env { border-color: var(--line); color: var(--muted); font-weight: 500; }
.kicker { font-size: 12px; color: var(--muted); }
.ttl { font-weight: 700; font-size: 17px; line-height: 1.3; }
.big { font-family: var(--font-num); font-size: 32px; font-weight: 600; color: var(--red); line-height: 1.1; font-variant-numeric: tabular-nums; }
.big small { font-size: 13px; color: var(--muted); font-weight: 500; }
.stack { display: flex; height: 26px; border: 1.5px solid var(--ink); overflow: hidden; }
.stack i { display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: var(--on-red); width: 0; transition: width .6s cubic-bezier(.2, .8, .2, 1); white-space: nowrap; overflow: hidden; }
.stack .s-warm, .stack .s-cool { background: var(--fig-far); color: var(--ink); }
.stack .s-aero { background: var(--red); }
.stack .s-res { background: var(--ink); color: var(--screen); }
.stack .s-iso { background: var(--warn); }
.stack .s-bal { background: var(--good); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1.5px solid var(--line); padding: 10px 8px; background: var(--card); min-width: 0; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .n { font-family: var(--font-num); font-size: 24px; font-weight: 600; color: var(--red); line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat .n small { font-size: 12px; color: var(--muted); }
.stat .t { font-size: 12px; font-weight: 700; }
.meter5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; margin-top: 4px; }
.meter5 i { height: 5px; background: var(--line); }
.meter5 i.on { background: var(--red); }
.meter5 i.u { background: repeating-linear-gradient(45deg, var(--line) 0 2px, transparent 2px 4px); }
details.card summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.card summary::-webkit-details-marker { display: none; }
details.card summary::after { content: "+"; font-family: var(--font-num); color: var(--red); font-size: 18px; }
details.card[open] summary::after { content: "−"; }
ul.rf { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
ul.rf li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.tag { font-size: 11px; font-weight: 700; text-align: center; padding: 1px 0; border: 1.5px solid; }
.tag.y { color: var(--red); border-color: var(--red); } .tag.n { color: var(--muted); border-color: var(--line); }
.tag.p { color: var(--good); border-color: var(--good); } .tag.u { color: var(--warn); border-color: var(--warn); }
.chg { display: grid; gap: 8px; }
.chg .r { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.chg .r b { font-weight: 500; color: var(--muted); }
.chg .trk { height: 8px; background: var(--line); position: relative; }
.chg .trk i { position: absolute; inset: 0 auto 0 0; background: var(--good); width: 0; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.chg .v { font-family: var(--font-num); font-weight: 600; font-size: 13px; white-space: nowrap; }
.answers { display: grid; }

<script>
// ---------- animated exercise figures (side view, 100x100) ----------
const FIG = (() => {
  const P = (x, y) => ({ x, y });
  const Lp = (a, b, e) => P(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e);
  const add = (a, dx, dy) => P(a.x + dx, a.y + dy);
  const osc = (t) => 0.5 - 0.5 * Math.cos(2 * Math.PI * t);
  const f = (n) => n.toFixed(1);
  function ik(a, t, l1, l2, pr) {
    const dx = t.x - a.x, dy = t.y - a.y, d = Math.hypot(dx, dy) || 0.01;
    const dc = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.2);
    const ux = dx / d, uy = dy / d, end = P(a.x + ux * dc, a.y + uy * dc);
    const base = Math.atan2(uy, ux), c = (l1 * l1 + dc * dc - l2 * l2) / (2 * l1 * dc), al = Math.acos(Math.max(-1, Math.min(1, c)));
    const j1 = P(a.x + l1 * Math.cos(base + al), a.y + l1 * Math.sin(base + al));
    const j2 = P(a.x + l1 * Math.cos(base - al), a.y + l1 * Math.sin(base - al));
    const mx = (a.x + end.x) / 2, my = (a.y + end.y) / 2;
    const sc = (j) => (j.x - mx) * pr[0] + (j.y - my) * pr[1];
    return { j: sc(j1) >= sc(j2) ? j1 : j2, end };
  }
  function draw(p) {
    const ux = p.neck.x - p.hip.x, uy = p.neck.y - p.hip.y, ul = Math.hypot(ux, uy) || 1;
    const head = P(p.neck.x + (ux / ul) * 8, p.neck.y + (uy / ul) * 8);
    const sh = P(p.neck.x - (ux / ul) * 2, p.neck.y - (uy / ul) * 2);
    const kp = p.kp || [1, 0], ep = p.ep || [-1, 0.3], hl = p.hl || "";
    const limb = (a, t, l1, l2, pr, cls) => { const r = ik(a, t, l1, l2, pr); return { s: `<path class="${cls}" d="M${f(a.x)} ${f(a.y)}L${f(r.j.x)} ${f(r.j.y)}L${f(r.end.x)} ${f(r.end.y)}"/>`, end: r.end }; };
    const cL = hl === "legs" ? "hl" : "nr", cA = hl === "arms" ? "hl" : "nr", cT = hl === "core" ? "hlt" : "tor";
    const fl = limb(p.hip, p.feet[1], 15, 15, kp, "fr"), fa = limb(sh, p.hands[1], 11, 11, ep, "fr");
    const nl = limb(p.hip, p.feet[0], 15, 15, kp, cL), na = limb(sh, p.hands[0], 11, 11, ep, cA);
    const toe = (e, cls) => p.toe ? `<path class="${cls}" d="M${f(e.x)} ${f(e.y)}l${p.toe[0]} ${p.toe[1]}"/>` : "";
    return (p.back || "") + fl.s + toe(fl.end, "fr") + fa.s +
      `<path class="${cT}" d="M${f(p.hip.x)} ${f(p.hip.y)}L${f(p.neck.x)} ${f(p.neck.y)}"/>` +
      nl.s + toe(nl.end, cL) + `<circle class="hd" cx="${f(head.x)}" cy="${f(head.y)}" r="6"/>` + na.s + (p.front || "");
  }
  const G = `<path class="gr" d="M6 86.5H94"/>`;
  const dumb = (h, v) => v
    ? `<g class="pf"><rect x="${f(h.x - 1.4)}" y="${f(h.y - 6)}" width="2.8" height="12" rx="1"/><rect x="${f(h.x - 3.2)}" y="${f(h.y - 7)}" width="6.4" height="2.6" rx="0.8"/><rect x="${f(h.x - 3.2)}" y="${f(h.y + 4.4)}" width="6.4" height="2.6" rx="0.8"/></g>`
    : `<g class="pf"><rect x="${f(h.x - 6)}" y="${f(h.y - 1.2)}" width="12" height="2.4" rx="1"/><rect x="${f(h.x - 7)}" y="${f(h.y - 3.2)}" width="2.6" height="6.4" rx="0.8"/><rect x="${f(h.x + 4.4)}" y="${f(h.y - 3.2)}" width="2.6" height="6.4" rx="0.8"/></g>`;
  const dash = (t) => `<path class="gr" stroke-dasharray="4 9" stroke-dashoffset="${f(t * 26)}" d="M6 91H94"/>`;
  const stand = (hip = P(50, 55.5), neck = P(51, 31.5)) => ({ hip, neck });

  const T = {
    walkT: { per: 1.15, cue: "팔을 자연스럽게 흔들고 손잡이에 기대지 않기", f: (t) => {

      return { hip, neck, feet: [P(49 + 9 * sn, 85 - Math.max(0, cs) * 5), P(49 - 9 * sn, 85 - Math.max(0, -cs) * 5)], hands: [add(neck, -8 * sn, 20), add(neck, 8 * sn, 20)], kp: [1, 0], ep: [-1, 0.2], hl: "legs", toe: [4, 0],

      return { hip: P(44, 52), neck: P(57, 31), feet: [P(c.x + r * Math.cos(s), c.y + r * Math.sin(s)), P(c.x - r * Math.cos(s), c.y - r * Math.sin(s))], hands: [P(71, 42), P(70, 43)], kp: [1, -0.5], ep: [-0.2, 1], hl: "legs",
        back: `<circle class="pr" cx="77" cy="73" r="10"/><circle class="gr" cx="57" cy="73" r="8"/><path class="pr" d="M37 52H50M44 53L50 74L77 73M73 43L77 73M68 43H77M30 86.5H88M50 74L44 86M77 73L82 86"/>` };
    } },
    swim: { per: 1.5, cue: "물속에선 심박수가 낮게 나오니 숨찬 정도로 조절", f: (t) => {
      const s = 2 * Math.PI * t; let w = "M0 45";
      for (let x = 0; x <= 100; x += 5) w += `L${x} ${f(44 + 1.6 * Math.sin(x / 7 + s * 2))}`;
      return { hip: P(40, 52), neck: P(64, 50), feet: [P(13, 53 + 4 * Math.sin(s * 3)), P(13, 53 - 4 * Math.sin(s * 3))], hands: [P(62 + 19 * Math.cos(s), 50 + 12 * Math.sin(s)), P(62 - 19 * Math.cos(s), 50 - 12 * Math.sin(s))], kp: [0, 1], ep: [0, -1], hl: "arms",
        back: `<path class="wv" d="${w}"/><path class="gr" d="M6 70H94"/>` };

    squatA: { per: 2.8, cue: "엉덩이를 뒤로 빼며 의자에 앉듯 내려가기", f: (t) => {
      const e = osc(t), hip = Lp(P(50, 55.5), P(40, 68), e), neck = Lp(P(51, 31.5), P(52, 47), e), h = Lp(add(neck, 3, 20), add(neck, 19, 3), e);
      return { hip, neck, feet: [P(54, 85), P(52, 85)], hands: [h, add(h, -1, 1)], kp: [1, 0], ep: [-1, 0.4], hl: "legs", toe: [4, 0], back: G };

    squatG: { per: 2.8, cue: "덤벨을 가슴에 붙이고 가슴을 편 채 앉기", f: (t) => {
      const e = osc(t), hip = Lp(P(50, 55.5), P(40, 68), e), neck = Lp(P(51, 31.5), P(52, 47), e), h = add(neck, 7, 10);
      return { hip, neck, feet: [P(54, 85), P(52, 85)], hands: [h, add(h, -1, 1)], kp: [1, 0], ep: [-1, 0.6], hl: "legs", toe: [4, 0], back: G, front: dumb(add(h, 2, 0), true) };
    } },
    squatC: { per: 3.0, cue: "의자에 엉덩이가 닿으면 바로 일어서기 · 통증 없는 범위만", f: (t) => {
      const e = osc(t), hip = Lp(P(50, 55.5), P(41, 66), e), neck = Lp(P(51, 31.5), P(53, 45), e), h = Lp(add(neck, 3, 20), add(neck, 18, 4), e);

      return { hip, neck, feet: [P(51, 85), P(49, 85)], hands: [h, add(h, -1, 0)], kp: [1, 0], ep: [-1, 0], hl: "legs", toe: [4, 0], back: G, front: dumb(h) };

    bridge: { per: 3.0, cue: "엉덩이를 조이며 어깨-골반-무릎이 일직선이 되게", f: (t) => {

        back: `<path class="pr" d="M14 68H74M20 68V86M68 68V86"/>`, front: `<circle class="pa" cx="${f(ft.x)}" cy="${f(ft.y - 3)}" r="2.6"/>` };
    } },

        back: `<path class="pr" d="M33 38V68M31 68H48M40 68V86M30 86.5H66"/>`, front: `<path class="pa" d="M${f(h.x)} ${f(h.y - 4)}V${f(h.y + 4)}"/>` };

      const r = T.seatpress.f(t), h = r.hands[0]; r.back += `<path class="bd" d="M31 46Q${f((h.x + 31) / 2)} 52 ${f(h.x)} ${f(h.y)}"/>`; r.front = ""; return r;
    } },
    floorpress: { per: 2.8, cue: "팔꿈치가 바닥에 닿으면 멈췄다가 밀기", f: (t) => {
      const e = osc(t), h = Lp(P(30, 70), P(30, 58), e);
      return { hip: P(52, 80), neck: P(28, 79), feet: [P(66, 85), P(64, 85)], hands: [h, add(h, 1, 0)], kp: [0, -1], ep: [0, 1], hl: "arms", back: G, front: dumb(h) };

    wallpush: { per: 2.6, cue: "몸을 일자로 유지하고 가슴을 벽 가까이", f: (t) => {
      const e = osc(t), neck = Lp(P(62, 33), P(67, 40), e), ft = P(36, 85), hip = Lp(ft, neck, 0.54);
      return { hip, neck, feet: [ft, P(38, 85)], hands: [P(78, 38), P(78, 40)], kp: [1, 0], ep: [0, 1], hl: "arms", toe: [4, 0],
        back: G + `<rect class="pf" x="80" y="10" width="4" height="77"/>` };
    } },
    row: { per: 2.8, cue: "가슴을 편 채 팔꿈치를 뒤로 당기기", f: (t) => {
      const e = osc(t), h = Lp(P(62, 48), P(48, 48), e);
      return { hip: P(40, 64), neck: P(42, 40), feet: [P(62, 72), P(61, 73)], hands: [h, add(h, -1, 1)], kp: [0.2, -1], ep: [-1, 0], hl: "arms",
        back: `<path class="pr" d="M34 66H52M43 66V86M30 86.5H90M64 64V82M90 86V44"/><circle class="pr" cx="88" cy="48" r="2.5"/><path class="pa" d="M${f(h.x)} ${f(h.y)}L86 48"/>` };

    return '<div class="scr fade rise"><h2>유의사항</h2>' + groups.map((g) => '<div class="card cgroup' + (g[3] ? " stop" : "") + '"><h3>' + ic(g[0]) + esc(g[1]) + "</h3><ul>" + g[2].map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>").join("") + "</div>";
  }

  render();
})();
</script>
